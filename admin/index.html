<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#11100e">
  <title>Willzinho Barber — Painel Administrativo</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body class="admin-page">
  <div class="noise"></div>
  <header class="topbar admin-header">
    <a class="brand" href="./" aria-label="Ir para a visão geral">
      <img class="brand-logo" src="../assets/logo-willzinho.jpeg" alt="Willzinho Barber">
      <span><b>WILLZINHO BARBER</b><small>PAINEL ADMINISTRATIVO</small></span>
    </a>
    <div class="admin-header-label">ÁREA RESTRITA</div>
    <a class="outline-btn desktop-only" href="../">Ver site público <span>↗</span></a>
  </header>

  <main id="admin-view" class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-label">PAINEL ADMINISTRATIVO</div>
      <nav>
        <button class="admin-nav active" data-admin-tab="dashboard"><span>⌁</span>Visão geral</button>
        <button class="admin-nav" data-admin-tab="agenda"><span>□</span>Agendamentos</button>
        <button class="admin-nav" data-admin-tab="clients"><span>☺</span>Clientes</button>
        <button class="admin-nav" data-admin-tab="services"><span>✦</span>Serviços</button>
        <button class="admin-nav" data-admin-tab="hours"><span>◷</span>Horários</button>
      </nav>
      <div class="admin-user"><div>AD</div><span><b>Administrador</b><small>Operação da barbearia</small></span></div>
    </aside>
    <section class="admin-content">
      <div class="admin-top"><div><p class="eyebrow"><span></span> Operação em tempo real</p><h2 id="admin-title">VISÃO GERAL</h2></div><a class="primary-btn small" href="../">Ver site público <span>↗</span></a></div>
      <section id="admin-dashboard" class="admin-panel"></section>
      <section id="admin-agenda" class="admin-panel hidden"></section>
      <section id="admin-clients" class="admin-panel hidden"></section>
      <section id="admin-services" class="admin-panel hidden"></section>
      <section id="admin-hours" class="admin-panel hidden"></section>
    </section>
  </main>

  <dialog id="message-dialog" class="app-dialog">
    <button class="dialog-close" aria-label="Fechar">×</button>
    <p class="eyebrow"><span></span> Mensagem pronta</p><h3>CONFIRA ANTES DE ENVIAR</h3>
    <textarea id="message-preview" rows="8"></textarea>
    <button id="open-whatsapp" class="primary-btn full">Abrir WhatsApp <span>↗</span></button>
  </dialog>
  <dialog id="reschedule-dialog" class="app-dialog">
    <button class="dialog-close" aria-label="Fechar">×</button>
    <p class="eyebrow"><span></span> Alterar agendamento</p><h3>REAGENDAR HORÁRIO</h3>
    <input id="reschedule-date" type="date"><div id="reschedule-slots" class="slots compact"></div>
    <button id="save-reschedule" class="primary-btn full" disabled>Confirmar reagendamento</button>
  </dialog>
  <div id="toast" class="toast" role="status"></div>
  <script src="../store.js"></script>
  <script src="../app.js" defer></script>
</body>
</html>
